services:
  app:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    container_name: confluence-rag
    ports:
      - "${SERVER_PORT:-5000}:5000"
    volumes:
      # 데이터 디렉토리 (크롤링 결과, 벡터 DB, 로그, 백업)
      - ./confluence_vectordb:/app/confluence_vectordb
      - ./confluence_pages:/app/confluence_pages
      - ./logs:/app/logs
      - ./backups:/app/backups
      # 크롤링 결과 JSON
      - ./confluence_backup.json:/app/confluence_backup.json
      - ./processed_chunks.json:/app/processed_chunks.json
      # 환경변수 파일
      - ./.env:/app/.env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    # Linux에서 host.docker.internal 사용을 위해 필요
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Ollama LLM 서버 (로컬에 Ollama가 없는 경우 사용)
  # 사용법: docker compose --profile with-ollama up
  ollama:
    profiles: ["with-ollama"]
    image: ollama/ollama:latest
    container_name: confluence-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
